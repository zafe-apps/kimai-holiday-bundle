services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: kimai
      MARIADB_USER: kimai
      MARIADB_PASSWORD: kimai
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  kimai:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_SECRET: dev-only-secret-not-for-production
      DATABASE_URL: mysql://kimai:kimai@db:3306/kimai?charset=utf8mb4&serverVersion=11.4.0-MariaDB
      MAILER_URL: null://null
      MAILER_FROM: kimai@example.test
    volumes:
      # writable on purpose: PHPUnit and Kimai caches live under var/
      - ..:/opt/kimai/var/plugins/HolidayBundle
    ports:
      - "8001:8001"
    command: php -d memory_limit=-1 -d variables_order=EGPCS -S 0.0.0.0:8001 -t public
